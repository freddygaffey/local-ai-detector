name: E2E (Chrome, real models)

# Real-browser tests with real models. Runs on every push to main (in the
# background, nothing waits on it), weekly, and on demand. Models are cached.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Include Binoculars and warm re-runs (slower)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAD_SCRATCH: ${{ github.workspace }}/.e2e-scratch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium for Testing
        run: npx playwright install --with-deps chromium

      # The browser profile holds the Cache API copy of the models; keying on
      # the pinned revisions re-downloads only when a model pin changes.
      - uses: actions/cache@v6
        with:
          path: ${{ env.LAD_SCRATCH }}/chrome-profile
          key: e2e-models-${{ hashFiles('src/engine/models.ts') }}

      - run: npm run build:e2e

      - name: Run Chrome E2E
        run: >
          xvfb-run --auto-servernum
          node scripts/e2e/chrome.mjs
          ${{ inputs.full && '' || '--quick' }}
          --out ${{ env.LAD_SCRATCH }}/chrome-report.json
          --shots ${{ env.LAD_SCRATCH }}/shots

      # Artifacts need a login to download; annotations are public. Surface each
      # failed step (and any launch crash) as an annotation so failures are
      # readable from the run page and the REST API.
      - name: Annotate failed E2E steps
        if: always()
        run: |
          f="${{ env.LAD_SCRATCH }}/chrome-report.json"
          if [ ! -f "$f" ]; then echo "::error title=E2E::no report written (crashed before the first step?)"; exit 0; fi
          node -e '
            const r = require(process.argv[1]);
            const failed = r.steps.filter(s => !s.ok);
            console.log(`E2E: ${r.steps.length - failed.length}/${r.steps.length} steps passed`);
            for (const s of failed) console.log(`::error title=E2E step failed::${s.title} :: ${String(s.error).replace(/\n/g, " ").slice(0, 900)}`);
          ' "$f"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-chrome-report
          path: |
            ${{ env.LAD_SCRATCH }}/chrome-report.json
            ${{ env.LAD_SCRATCH }}/shots
          if-no-files-found: warn
