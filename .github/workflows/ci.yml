name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build, lint, package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + DOM tests
        run: npm test

      # scripts/package.mjs does a clean Chrome + Firefox build, re-runs the
      # checks, web-ext lint, zips, content checks and SHA-256 sums.
      - name: Package (both browsers)
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
